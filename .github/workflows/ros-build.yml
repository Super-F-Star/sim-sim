name: ROS 2 Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/super-f-star/driveless-sim-env:latest
      options: --user root

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 缓存 ccache (加速 C++/CUDA 编译)
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 3. 编译代码
        # ⚠️ 核心修改：强制指定使用 bash，否则 source 命令会报错
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+ --cmake-args \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DTENSORRT_DIR=/usr \
            -DTENSORRT_INCLUDE_DIR=/usr/include/x86_64-linux-gnu \
            -DTENSORRT_LIBRARY=/usr/lib/x86_64-linux-gnu/libnvinfer.so \
            -DNVONNXPARSER_LIBRARY=/usr/lib/x86_64-linux-gnu/libnvonnxparser.so \
            -DOpenVINO_DIR=/opt/openvino_2023.3/runtime/cmake \
            -DInferenceEngine_DIR=/opt/openvino_2023.3/runtime/cmake \
            -DCMAKE_PREFIX_PATH="/usr;/opt/openvino_2023.3/runtime/cmake"

      - name: 4. 打印所有包编译报错日志 (仅失败时)
        # 这里也建议加上 shell: bash 保险
        shell: bash
        if: failure()
        run: |
          echo "========= 编译失败日志 ========="
          for log in log/latest_build/*/stderr.log; do
            echo "--- $log ---"; cat "$log"
          done || true