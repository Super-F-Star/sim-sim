name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/super-f-star/driveless-sim-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max